# Expression catalog. Edit freely — the engine reads this at run time.
#   mode      genuine = a felt emotion; performed = deliberate (comedy, kindness, editorial)
#   v, a      valence (-1 sad .. +1 happy) and arousal (-1 sleepy .. +1 hyped): the
#             circumplex model of emotion. The engine targets a point from mood,
#             music and place, then picks the nearest allowed expressions.
#   allow     performed expressions are ONLY allowed when the scene has one of these contexts
#   banned_in contexts where this expression must never be used
#   suits     (optional) contexts a genuine expression belongs to; elsewhere it scores lower
#   face      what an image/video model must render (be precise: eyes, brows, mouth)
#   motion    how it plays across a 2-4s video clip
- {id: duchenne_smile, name: Real smile, mode: genuine, v: 0.8, a: 0.3, face: "genuine Duchenne smile — cheeks lifted, crow's-feet creases at the outer eyes, lower eyelids pushed up, teeth showing", motion: "smile builds from the eyes first, then the mouth, holds warmly"}
- {id: duchenne_laugh, name: Laughing, mode: genuine, v: 0.85, a: 0.75, face: "mid-laugh — head tipped back slightly, eyes squeezed into crescents, mouth open, shoulders lifted", motion: "breaks into laughter, glances away, looks back still laughing"}
