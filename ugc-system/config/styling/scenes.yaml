# How free-text Mood / Day / Environment / Place is understood.
# Each place rule is matched (regex, case-insensitive) against the place +
# environment text; every matching rule is merged (first match wins for
# single values, lists are unioned). Unknown places fall back to `default`
# and, when an Opus key is set, Opus fills the gaps.
#
#   settings   tags poses use (home, street, beach, runway, ...)
#   formality  [min, max] outfit formality (1 street .. 10 black tie)
#   terrain    floor | pavement | sand | trail | grass | water
#   footwear   kinds allowed: sneakers heels flats sandals slides boots loafers formal_shoes sports barefoot
#   jewelry    none | minimal | everyday | statement | fine   (how much jewelry suits the moment)
#   props      things poses can use (mirror, stairs, chair, table, window, car, railing, bed, counter, escalator, pool, wall)
#   contexts   family kindness comedy editorial brand_trust romance nightlife festive travel food fitness work intimate review
#   va         baseline [valence, arousal] the place itself puts people in
default: {settings: [street], indoor: false, privacy: public, formality: [2, 6], terrain: pavement, footwear: [sneakers, flats, boots, loafers, sandals, heels], jewelry: everyday, props: [wall], lighting: "natural daylight", va: [0.4, 0.2]}
places:
  - {match: "bed ?room|bedroom|my room", settings: [bedroom, home], indoor: true, privacy: private, formality: [1, 4], terrain: floor, footwear: [barefoot, slides, sneakers, flats], jewelry: minimal, props: [mirror, bed, window, chair], lighting: "soft window light, warm lamp", contexts: [intimate], va: [0.5, -0.45]}
  - {match: "kitchen|cooking", settings: [kitchen, home], indoor: true, privacy: private, formality: [1, 4], terrain: floor, footwear: [barefoot, slides, flats, sneakers], jewelry: minimal, props: [counter, table, window], lighting: "bright kitchen daylight", contexts: [food, family], va: [0.55, 0.1]}
  - {match: "\\bhome\\b|house|apartment|flat\\b|living ?room|balcony|terrace", settings: [home], indoor: true, privacy: private, formality: [1, 4], terrain: floor, footwear: [barefoot, slides, sneakers, flats, sandals], jewelry: minimal, props: [mirror, chair, window, stairs, bed, railing, wall], lighting: "soft window light", contexts: [intimate], va: [0.5, -0.4]}
  - {match: "mcdonald|kfc|burger ?king|domino|subway|pizza hut|fast ?food|food ?court|burger|fries|street food|chaat|dhaba", settings: [fastfood], indoor: true, privacy: public, formality: [1, 3], terrain: floor, footwear: [sneakers, slides, sandals, flats, boots], jewelry: minimal, props: [table, chair, counter, wall], lighting: "bright overhead fluorescent light with neon signage", contexts: [food], va: [0.6, 0.45]}
  - {match: "mall|shopping|store|boutique|trial room|fitting room|phoenix|dlf", settings: [mall], indoor: true, privacy: public, formality: [2, 6], terrain: floor, footwear: [sneakers, flats, boots, loafers, heels, sandals], jewelry: everyday, props: [escalator, mirror, stairs, wall], lighting: "bright retail lighting", va: [0.55, 0.4]}
  - {match: "cafe|café|coffee|starbucks|brunch|bakery|tea ?house", settings: [cafe], indoor: true, privacy: public, formality: [2, 6], terrain: floor, footwear: [sneakers, flats, boots, loafers, sandals, heels], jewelry: everyday, props: [table, chair, window, wall], lighting: "warm cafe light by the window", contexts: [food], va: [0.55, -0.1]}
  - {match: "restaurant|fine dining|dinner|rooftop bar|bistro", settings: [restaurant], indoor: true, privacy: public, formality: [5, 9], terrain: floor, footwear: [heels, loafers, formal_shoes, flats, boots], jewelry: statement, props: [table, chair, window], lighting: "warm candle-lit ambience", contexts: [food], va: [0.6, 0.2]}
  - {match: "beach|goa|bali|maldives|phuket|sea ?side|seashore|shore|coast", settings: [beach], indoor: false, privacy: public, formality: [1, 4], terrain: sand, footwear: [sandals, slides, barefoot], jewelry: minimal, props: [], lighting: "golden-hour sun, sea breeze", contexts: [travel], weather: hot, va: [0.75, 0.25]}
  - {match: "pool|resort|villa", settings: [pool, hotel], indoor: false, privacy: semi, formality: [1, 5], terrain: floor, footwear: [slides, sandals, barefoot], jewelry: minimal, props: [pool, chair, railing], lighting: "bright midday sun on water", contexts: [travel], weather: hot, va: [0.7, 0.0]}
  - {match: "mountain|hike|trek|manali|ladakh|kasol|shimla|forest|waterfall|camping|nature|national park", settings: [nature], indoor: false, privacy: public, formality: [1, 3], terrain: trail, footwear: [sneakers, boots, sports], jewelry: minimal, props: [], lighting: "crisp mountain daylight", contexts: [travel], va: [0.6, 0.35]}
  - {match: "park|garden|picnic|lawn", settings: [nature, street], indoor: false, privacy: public, formality: [1, 5], terrain: grass, footwear: [sneakers, sandals, flats, boots, slides], jewelry: everyday, props: [], lighting: "dappled sunlight through trees", va: [0.6, 0.0]}
  - {match: "vacation|holiday|trip|paris|eiffel|london|dubai|burj|new york|nyc|tokyo|rome|santorini|taj mahal|india gate|gateway of india|temple|fort|palace|landmark|monument|museum|old town", settings: [landmark, street], indoor: false, privacy: public, formality: [2, 7], terrain: pavement, footwear: [sneakers, flats, boots, loafers, sandals], jewelry: everyday, props: [stairs, railing, wall], lighting: "bright travel daylight", contexts: [travel], va: [0.7, 0.5]}
  - {match: "office|work|meeting|corporate|cowork|interview|presentation|conference", settings: [office], indoor: true, privacy: semi, formality: [5, 8], terrain: floor, footwear: [loafers, formal_shoes, heels, flats, boots], jewelry: everyday, props: [table, chair, window, wall, escalator], lighting: "cool office daylight", contexts: [work], va: [0.2, 0.2]}
  - {match: "studio|photo ?shoot|shoot|lookbook|campaign|editorial", settings: [studio], indoor: true, privacy: private, formality: [1, 10], terrain: floor, footwear: [sneakers, heels, boots, loafers, formal_shoes, flats, sandals, barefoot], jewelry: statement, props: [chair, wall, window], lighting: "controlled studio strobe on a seamless backdrop", contexts: [editorial], va: [0.3, 0.2]}
  - {match: "ramp|runway|catwalk|fashion show|fashion week", settings: [runway, event], indoor: true, privacy: public, formality: [6, 10], terrain: floor, footwear: [heels, boots, formal_shoes, loafers], jewelry: statement, props: [], lighting: "hard runway spotlights and photographer flashes", contexts: [editorial], va: [0.15, 0.35]}
  - {match: "gym|workout|yoga|pilates|run\\b|running|crossfit|sports", settings: [gym], indoor: true, privacy: public, formality: [1, 2], terrain: floor, footwear: [sports, sneakers, barefoot], jewelry: none, props: [mirror, wall], lighting: "bright gym lighting", contexts: [fitness], va: [0.35, 0.75]}
  - {match: "club|party|night ?out|bar\\b|pub|lounge|concert|gig|rave", settings: [nightlife, event], indoor: true, privacy: public, formality: [5, 9], terrain: floor, footwear: [heels, boots, sneakers, loafers], jewelry: statement, props: [table, chair, wall], lighting: "flash photography against neon and dark", contexts: [nightlife], va: [0.6, 0.8]}
  - {match: "wedding|sangeet|mehendi|mehndi|haldi|reception|diwali|eid|holi|navratri|garba|puja|pooja|festival|festive|karwa|lohri|pongal|onam", settings: [festive, event], indoor: false, privacy: semi, formality: [6, 10], terrain: floor, footwear: [heels, flats, sandals, formal_shoes, loafers], jewelry: fine, props: [stairs, chair, wall], lighting: "warm fairy lights and diyas", contexts: [festive, family], va: [0.75, 0.55]}
  - {match: "date|romantic|anniversary|valentine", settings: [restaurant, cafe], indoor: true, privacy: semi, formality: [4, 8], terrain: floor, footwear: [heels, loafers, boots, flats, sneakers], jewelry: statement, props: [table, chair], lighting: "warm low light", contexts: [romance], va: [0.65, 0.25]}
  - {match: "airport|flight|terminal|lounge|travel day", settings: [airport], indoor: true, privacy: public, formality: [2, 6], terrain: floor, footwear: [sneakers, boots, loafers, flats, slides], jewelry: minimal, props: [escalator, wall, chair], lighting: "big-window terminal daylight", contexts: [travel], va: [0.5, 0.3]}
  - {match: "college|campus|class|university|hostel|school", settings: [campus, street], indoor: false, privacy: public, formality: [1, 5], terrain: pavement, footwear: [sneakers, slides, sandals, boots, flats], jewelry: minimal, props: [stairs, wall, chair, table], lighting: "midday campus daylight", va: [0.5, 0.35]}
  - {match: "street|city|downtown|market|bazaar|thrift|flea|sarojini|colaba|bandra|lane", settings: [street], indoor: false, privacy: public, formality: [1, 6], terrain: pavement, footwear: [sneakers, boots, flats, sandals, slides, loafers], jewelry: everyday, props: [wall, stairs, car], lighting: "street daylight", va: [0.5, 0.4]}
  - {match: "car|drive|road ?trip|uber|cab", settings: [car], indoor: true, privacy: semi, formality: [1, 7], terrain: floor, footwear: [sneakers, flats, slides, sandals, boots, loafers], jewelry: everyday, props: [car], lighting: "daylight through the windshield", va: [0.55, 0.3]}
  - {match: "hotel|staycation|suite", settings: [hotel], indoor: true, privacy: private, formality: [2, 8], terrain: floor, footwear: [slides, barefoot, heels, sneakers, flats, loafers], jewelry: everyday, props: [mirror, window, railing, bed, chair], lighting: "soft hotel lamp light", contexts: [travel], va: [0.6, -0.1]}
# Situations in the mood/environment/notes text that change what is allowed.
situations:
  - {match: "(kid|child|son|daughter|niece|nephew|little (sister|brother)).{0,40}(cook|bak|food|recipe|dish|dinner|breakfast|lunch|pasta|maggi|cake|chai|sandwich|omelette)|first time cooking|made (me )?(food|breakfast|dinner|lunch|pasta|maggi|cake|chai)", contexts: [family, kindness, food], note: "a child cooked for them: praise the effort warmly even if it tastes off — performed kindness is right here"}
  - {match: "gift(ed)?|present|handmade|made (it|this) for me|souvenir|grandma|grandmother|nani|dadi|(niece|nephew|kid|child|son|daughter|sister|brother|friend|mom|mum|dad|grandma).{0,30}made", contexts: [family, intimate], note: "a gifted or handmade piece carries a story — feature it"}
  - {match: "sponsor|brand deal|collab|#ad|\\bad\\b|paid|promo|partnership|review|unboxing|testimonial", contexts: [brand_trust, review], note: "brand-trust moment: only genuine expressions; claims must look honest"}
  - {match: "skit|prank|comedy|meme|\\bpov\\b|funny|parody|roast|relatable", contexts: [comedy], note: "comedy: performed expressions (deadpan, side-eye, mock horror) are tools"}
  - {match: "funeral|hospital|loss|grief|sad news|breakup", contexts: [family, intimate], va: [-0.6, -0.3], note: "sensitive moment: keep it quiet and respectful, no comedy"}
  - {match: "first date|proposal|anniversary", contexts: [romance]}
