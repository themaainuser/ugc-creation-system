# What they are listening to -> [valence, arousal]. Music pulls the face
# toward the song's feeling (emotional contagion), weighted by `music_weight`.
music:
  - {match: "sad|heartbreak|breakup|arijit|ballad|slowed|reverb|emo", va: [-0.45, -0.35]}
  - {match: "lo-?fi|chill|acoustic|ambient|jazz|indie|bossa|piano", va: [0.35, -0.55]}
  - {match: "classical|instrumental|orchestral|sitar|flute", va: [0.4, -0.45]}
  - {match: "romantic|love song|\\blove\\b|r&b|rnb|soul", va: [0.6, 0.0]}
  - {match: "bollywood dance|punjabi|bhangra|dhol|garba|item song", va: [0.85, 0.85]}
  - {match: "edm|house|techno|party|club|dance|kpop|k-pop|disco|pop", va: [0.7, 0.75]}
  - {match: "hip ?hop|rap|drill|trap|phonk|desi hip", va: [0.35, 0.8]}
  - {match: "rock|metal|punk|grunge", va: [0.2, 0.85]}
  - {match: "devotional|bhajan|kirtan|gospel|qawwali", va: [0.6, -0.2]}
  - {match: "motivational|workout|gym|hype", va: [0.55, 0.9]}
  - {match: "retro|90s|old songs|kishore|lata|rafi|throwback", va: [0.55, -0.15]}
music_weight: 0.35
place_weight: 0.15
